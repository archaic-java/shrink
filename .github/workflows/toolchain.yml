name: Prepare Helix smoke test
on: push
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - name: Collect Helix
        run: curl --fail --location --retry 3 https://github.com/helix-editor/helix/releases/download/25.07.1/helix-25.07.1-x86_64-linux.tar.xz -o helix.tar.xz
      - uses: actions/upload-artifact@v4
        with:
          name: helix-smoke-tool
          path: helix.tar.xz
          retention-days: 1
